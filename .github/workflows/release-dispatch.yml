name: Dispatch Events

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag that was just published
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      sha:
        description: Commit the tag points at
        required: true
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
    steps:
      - name: Wait for the release image to be published
        # Docker Release builds on the tag push, which races this workflow's
        # release:published trigger. hassio-addons smoke-tests by pulling the
        # image, so don't notify anyone until the tag actually exists.
        run: |
          VERSION="${TAG#v}"
          for i in $(seq 1 60); do
            if curl -sf "https://hub.docker.com/v2/repositories/espresense/espresense-companion/tags/$VERSION" >/dev/null; then
              echo "espresense/espresense-companion:$VERSION is published"
              exit 0
            fi
            echo "waiting for espresense/espresense-companion:$VERSION ($i/60)"
            sleep 15
          done
          echo "timed out waiting for espresense/espresense-companion:$VERSION" >&2
          exit 1

      - name: Repository Dispatch to ESPresense.com
        # The website lists stable releases only.
        if: env.PRERELEASE != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ESPRESENSE_CONTENTS_TOKEN }}
          repository: ESPresense/ESPresense.com
          event-type: new-release
          client-payload: >
            {
              "repository": "ESPresense/ESPresense-companion",
              "ref": "refs/tags/${{ env.TAG }}",
              "sha": "${{ inputs.sha || github.sha }}"
            }

      - name: Repository Dispatch to hass-addons
        # The beta add-on takes prereleases and stable releases; the stable
        # add-on filters prereleases out itself.
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ESPRESENSE_CONTENTS_TOKEN }}
          repository: ESPresense/hassio-addons
          event-type: update-version
          client-payload: >
            {
              "repository": "ESPresense/ESPresense-companion",
              "ref": "refs/tags/${{ env.TAG }}",
              "sha": "${{ inputs.sha || github.sha }}"
            }
