# Geometry for the #2220 room-flip regression fixture.
#
# Verbatim from the reporter's redacted config.yaml on
# https://github.com/ESPresense/ESPresense/issues/2220 (attachment 25887337, 2026-03-11,
# sha256 4607e453c78e25c2...) - the `map`, `timeout`, `floors` and `nodes` blocks, unaltered.
# Note every node lists all three floors: that is the as-captured state and it is the
# condition the flip needs. Do not "tidy" it.
#
# Deliberately NOT carried over: mqtt / gps (redacted upstream), optimization, history,
# devices, exclude_devices, and `locators`. The locators block is supplied per test arm
# (see RoomFlip2220Tests) so the as-captured and multi_floor arms differ in exactly one thing.

map:
  flip_x: false        # Set to true to flip X coordinates (default: false)
  flip_y: true         # Set to true to use bottom-left origin, false for top-left origin (default: true)
  wall_thickness: 0.17 # Wall thickness in meters
  wall_color: "#ddd"   # Optional wall color, if not set uses room color
  wall_opacity: 0.35   # Optional wall opacity, if not set defaults to 0.35

# How long before device considered stale
timeout: 30
# How long before device is considered away

floors:
  - id: lower_ground_floor
    name: Lower Ground Floor
    # Bounds (x,y,z) of map in meters
    bounds: [[0, 0, 0], [10.06, 5.44, 3.41]]
    rooms:
      - name: Dining Room
        # Optional room color in hex; if omitted, server assigns a deterministic color
        # color: "#1F77B4"
        points:
          - [0.0, 0.0]
          - [0.0, 5.44]
          - [4.2, 5.44]
          - [4.2, 0.0]
          - [0.0, 0.0]
      - name: Shower Room
        # Optional room color in hex; if omitted, server assigns a deterministic color
        # color: "#1F77B4"
