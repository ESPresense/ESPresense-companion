          - [4.2, 0.0]
          - [4.2, 1.47]
          - [5.16, 1.47]
          - [5.16, 2.91]
          - [6.72, 2.91]
          - [6.72, 0.0]
          - [4.2, 0.0]
      - name: Lower Ground Floor Hallway
